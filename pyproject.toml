[project]
name = "morning-feed"
version = "0.1.0"
description = "Daily article EPUBs served as an OPDS catalog for e-ink readers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "trafilatura>=1.12",
    "lxml>=5.0",
    "lxml_html_clean>=0.4",
    "EbookLib>=0.18",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
